name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Detect which files changed to determine if WASM rebuild is needed
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            wasm:
              - 'libADLMIDI/**'
              - 'build.sh'
              - '.emsdk-version'
              - 'scripts/build-*'
              - '.gitmodules'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Check libADLMIDI version sync
        run: npm run sync-version -- --check

  # Build WASM when C/C++ files change or when no cache exists
  wasm-build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      # Check if we can skip the build by restoring from cache
      - name: Check for cached WASM build
        id: cache-check
        if: needs.changes.outputs.wasm != 'true'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            build-*/
            dist/
          key: wasm-build-${{ github.sha }}
          restore-keys: |
            wasm-build-${{ github.event.pull_request.base.sha }}
            wasm-build-
          lookup-only: true

      - name: Restore ccache
        if: needs.changes.outputs.wasm == 'true' || steps.cache-check.outputs.cache-matched-key == ''
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .ccache/
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # Only build if files changed OR no cache exists
      # Note: cache-hit is only true for exact key match; cache-matched-key is set for any match including restore-keys
      - name: Build WASM with Docker
        if: needs.changes.outputs.wasm == 'true' || steps.cache-check.outputs.cache-matched-key == ''
        run: ./build.sh all

      - name: Cache WASM build
        if: needs.changes.outputs.wasm == 'true' || steps.cache-check.outputs.cache-matched-key == ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            build-*/
            dist/
          key: wasm-build-${{ github.sha }}

      - name: Save ccache
        if: needs.changes.outputs.wasm == 'true' || steps.cache-check.outputs.cache-matched-key == ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .ccache/
          key: ccache-${{ runner.os }}-${{ github.sha }}

  # Always run JS build, using WASM from wasm-build job
  js-build:
    needs: [changes, wasm-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci

      - name: Restore WASM build from cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            build-*/
            dist/
          key: wasm-build-${{ github.sha }}
          restore-keys: |
            wasm-build-
          fail-on-cache-miss: true

      - name: Generate JS bundles
        run: |
          npm run build:js
          npm run build:banks

      - name: Upload dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    needs: [lint, js-build]
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 24.x, node]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build types
        run: npm run build:types

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run browser tests
        run: npm run test:browser

      - name: Run bundler smoke test
        run: npm run test:bundler

      - name: Upload Playwright report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
