name: Deploy to GitHub Pages

# Mitigations applied: checkout ref pinned to workflow_run.head_sha,
# persist-credentials: false, pages: write / id-token: write scoped to deploy
# job only, branches limited to main/master.
on:
  # zizmor: ignore[dangerous-triggers] workflow_run is intentional; deploy gates on CI success.
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # Required to download artifacts from the triggering CI run
    # Only deploy if CI succeeded (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # For workflow_run, pin to the triggering workflow's head SHA so the
          # build matches the CI run that produced the dist artifacts.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # For workflow_run events, download artifacts from the triggering CI run
      - name: Download dist from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For manual dispatch, we need to build ourselves
      - name: Build (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Prepare docs
        run: |
          # Create docs/examples directory
          mkdir -p docs/examples
          
          # Copy dist and src (examples import from src/profiles/)
          cp -r dist docs/dist
          cp -r src docs/src
          
          # Copy examples
          cp examples/*.html docs/examples/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  # Deploy to project page: https://libadlmidi-js.github.io/libadlmidi-js/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Deploy to org root: https://libadlmidi-js.github.io/
  deploy-root:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download built docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: site

      - name: Extract artifact
        run: |
          cd site
          tar -xf artifact.tar
          rm artifact.tar

      - name: Deploy to libadlmidi-js.github.io
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: libadlmidi-js/libadlmidi-js.github.io
          publish_branch: main
          publish_dir: ./site
