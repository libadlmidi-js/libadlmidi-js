name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # Required to download artifacts from other workflows

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only deploy if CI succeeded (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # For workflow_run events, download artifacts from the triggering CI run
      - name: Download dist from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For manual dispatch, we need to build ourselves
      - name: Build (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Prepare docs
        run: |
          # Create docs/examples directory
          mkdir -p docs/examples
          
          # Copy dist and src (examples import from src/profiles/)
          cp -r dist docs/dist
          cp -r src docs/src
          
          # Copy examples
          cp examples/*.html docs/examples/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs

  # Deploy to project page: https://libadlmidi-js.github.io/libadlmidi-js/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Deploy to org root: https://libadlmidi-js.github.io/
  deploy-root:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: site

      - name: Extract artifact
        run: |
          cd site
          tar -xf artifact.tar
          rm artifact.tar

      - name: Deploy to libadlmidi-js.github.io
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: libadlmidi-js/libadlmidi-js.github.io
          publish_branch: main
          publish_dir: ./site
